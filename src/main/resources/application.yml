spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fotoflow?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 500MB      # 单个文件最大（视频/封面都适用）
      max-request-size: 500MB   # 整个请求最大
      file-size-threshold: 0    # 大文件不占内存

mybatis:
  configuration:
    map-underscore-to-camel-case: true